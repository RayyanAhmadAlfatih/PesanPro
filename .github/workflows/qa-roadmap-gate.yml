name: QA Roadmap Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional live PesanPro base URL for L0 smoke tests"
        required: false
        default: "https://wagateway.kingofcoding.my.id"

permissions:
  contents: read

jobs:
  automated-l0-l2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/pesanpro_test
      AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      BASE_URL: https://pesanpro.example.com
      NEXT_PUBLIC_APP_URL: https://pesanpro.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Roadmap L1 authentication
        run: npm run qa:l1

      - name: Roadmap L2 tenant isolation
        run: npm run qa:l2

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

  live-l0:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PESANPRO_QA_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run L0 live smoke tests
        run: npm run qa:live:l0

      - name: Upload L0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pesanpro-l0-live-report
          path: artifacts/qa/l0-report.json
          if-no-files-found: warn
