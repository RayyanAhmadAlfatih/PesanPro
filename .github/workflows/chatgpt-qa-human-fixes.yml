name: ChatGPT Human QA Fix Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/pesanpro_test
      AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      BASE_URL: https://pesanpro.example.com
      NEXT_PUBLIC_APP_URL: https://pesanpro.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Package reviewed source
        run: git archive --format=zip --output=pesanpro-chatgpt-qa-fixed-source.zip HEAD

      - name: Upload reviewed source
        uses: actions/upload-artifact@v4
        with:
          name: pesanpro-chatgpt-qa-fixed-source
          path: pesanpro-chatgpt-qa-fixed-source.zip
          if-no-files-found: error
