version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pesanpro-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pesanpro}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pesanpro-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-pesanpro}
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=${BASE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${BASE_URL:-http://localhost:3000}/api
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-error}
      - NEXT_PUBLIC_SWAGGER_USERNAME=${NEXT_PUBLIC_SWAGGER_USERNAME:-admin}
      - NEXT_PUBLIC_SWAGGER_PASSWORD=${NEXT_PUBLIC_SWAGGER_PASSWORD}
      - NEXT_PUBLIC_SWAGGER_ENABLED=${NEXT_PUBLIC_SWAGGER_ENABLED:-true}
      - TZ=${TZ:-Asia/Jakarta}
      - LOCALE=${LOCALE:-id-ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PRIVATE_MEDIA_PATH=${PRIVATE_MEDIA_PATH:-data/private-media}
      - PRIVATE_MEDIA_RETENTION_DAYS=${PRIVATE_MEDIA_RETENTION_DAYS:-30}
      - MESSAGE_WORKER_MODE=embedded
      - SCHEDULE_WORKER_MODE=embedded
      - BROADCAST_WORKER_MODE=embedded
      - CAMPAIGN_WORKER_MODE=embedded
      - AUTOREPLY_WORKER_MODE=embedded
      - WEBHOOK_WORKER_MODE=embedded
      - ALLOW_INSECURE_WEBHOOKS=false
      - RUNTIME_HEARTBEAT_INTERVAL_MS=${RUNTIME_HEARTBEAT_INTERVAL_MS:-15000}
      - RUNTIME_HEARTBEAT_STALE_MS=${RUNTIME_HEARTBEAT_STALE_MS:-90000}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - BACKUP_DIR=${BACKUP_DIR:-backups}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE}
      - MONTHLY_INFRA_COST_IDR=${MONTHLY_INFRA_COST_IDR:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads
      - backup_data:/app/backups

volumes:
  mysql_data:
  app_data:
  uploads_data:
  backup_data:
